name: Notify downstream pipeline

# Note: this only asks the downstream pipeline to check whether anything
# here needs to flow back for review - it does NOT publish this site.
# Publishing is a separate, on-demand action taken elsewhere.
on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger downstream check
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.BITBUCKET_TRIGGER_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.bitbucket.org/2.0/repositories/veea/veea-dev-docs-internal/pipelines/" \
            -d '{
                  "target": {
                    "type": "pipeline_ref_target",
                    "ref_type": "branch",
                    "ref_name": "main",
                    "selector": { "type": "custom", "pattern": "github-reverse-sync-check" }
                  }
                }'
